<svg xmlns="http://www.w3.org/2000/svg" width="1156" height="320" viewBox="0 0 1156 320"><rect width="1156" height="320" rx="16" fill="#0D1117"/><text x="28" y="44" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#E6EDF3" text-anchor="start">Recall on questions it was never tuned on</text><text x="28" y="70" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#8B949E" text-anchor="start">65 notes · 90 answerable and 30 unanswerable questions written independently · defaults</text><text x="28" y="110" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#8B949E" text-anchor="start">finds the right note, with confidence</text><rect x="28" y="120" width="760" height="24" rx="6" fill="#161B22"/><rect x="28" y="120" width="667.1" height="24" rx="6" fill="#4CBB6A"/><text x="800" y="138" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#E6EDF3" text-anchor="start">88%</text><text x="28" y="180" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#8B949E" text-anchor="start">confident answers that are right</text><rect x="28" y="190" width="760" height="24" rx="6" fill="#161B22"/><rect x="28" y="190" width="625.4" height="24" rx="6" fill="#4CBB6A"/><text x="800" y="208" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#E6EDF3" text-anchor="start">82%</text><text x="28" y="250" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#8B949E" text-anchor="start">confident answers to unanswerable questions</text><rect x="28" y="260" width="760" height="24" rx="6" fill="#161B22"/><rect x="28" y="260" width="304.0" height="24" rx="6" fill="#F85149"/><text x="800" y="278" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#E6EDF3" text-anchor="star