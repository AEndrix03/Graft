<svg xmlns="http://www.w3.org/2000/svg" width="1156" height="446" viewBox="0 0 1156 446"><rect width="1156" height="446" rx="16" fill="#0D1117"/><text x="28" y="48" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#E6EDF3" text-anchor="start">Claude Code, with and without graft</text><text x="28" y="78" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#8B949E" text-anchor="start">15 questions about a team's own codebase, each asked twice. Typical answer (median).</text><rect x="28" y="100" width="536" height="250" rx="14" fill="#161B22" stroke="#30363D"/><text x="56" y="144" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#E6EDF3" text-anchor="start">Time to answer</text><text x="536" y="152" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#4CBB6A" text-anchor="end">−40%</text><text x="56" y="196" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#8B949E" text-anchor="start">without graft</text><rect x="56" y="206" width="480.0" height="34" rx="8" fill="#6E7681"/><text x="522.0" y="230" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0D1117" text-anchor="end">9.3 s</text><text x="56" y="268" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#8B949E" text-anchor="start">with graft</text><rect x="56" y="278" width="289.6" height="34" rx="8" fill="#4CBB6A"/><text x="331.6407179156754" y="302" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0D1117" text-anchor="end">5.6 s</text><rect x="592" y="100" width="536" height="250" rx="14" fill="#161B22" stroke="#30363D"/><text x="620" y="144" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#E6EDF3" text-anchor="start">Tokens written</text><text x="1100" y="152" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#4CBB6A" text-anchor="end">−49%</text><text x="620" y="196" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#8B949E" text-anchor="start">without graft</text><rect x="620" y="206" width="480.0" height="34" rx="8" fill="#6E7681"/><text x="1086.0" y="230" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0D1117" text-anchor="end">886 </text><text x="620" y="268" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#8B949E" text-anchor="start">with graft</text><rect x="620" y="278" width="243.3" height="34" rx="8" fill="#4CBB6A"/><text x="849.2505643340858" y="302" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0D1117" text-anchor="end">449 </text><text x="28" y="392" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#E6EDF3" text-anchor="start">Right answers: 27% → 73%.   Made-up answers: 27% → 0%.</text><text x="28" y="418" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#8B949E" text-anchor="start">On 75 general coding questions the model already knows: right answers 100% → 97%, time −3%, tokens −15%.</text><text x="1128" y="418" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#8B949E" text-anchor="end">model: sonnet · graft lookup time included</text></svg>
