[project]
name = "memgraph-mcp"
version = "0.1.0"
description = "MCP server bridging chat LLMs to the memgraph CLI"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.0",
]

[project.scripts]
memgraph-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["server.py"]
