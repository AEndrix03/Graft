[project]
name = "graft-mcp"
version = "0.1.0"
description = "MCP server bridging chat LLMs to the graft CLI"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.0",
  "httpx>=0.27",
  "PyJWT[crypto]>=2.8",
  "starlette>=0.37",
  "uvicorn>=0.30",
]

[project.scripts]
graft-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["server.py", "oauth_gateway.py"]
