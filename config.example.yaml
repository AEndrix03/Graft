daemon:
  socket_path: "/tmp/memgraph.sock"
  db_path: "./memgraph.db"

embedding:
  model_path: "./models/bge-m3.gguf"
  threads: 4
  ctx_size: 8192
  hardware_accel: false  # offload all layers to GPU. Requires llama.cpp built with -DGGML_CUDA=ON (NVIDIA) or -DGGML_HIP=ON (ROCm 6/7).

verification:
  cross_encoder_enabled: false # MVP: false. Accendi in v2 con il modello reranker.
  cross_encoder_model_path: "./models/bge-reranker-v2-m3.gguf"
  nli_enabled: false

cache:
  strong_hit_min_ce: 0.6
  strong_hit_min_lex: 0.15
  weak_hit_min_vec: 0.85
  min_lex_overlap: 0.05

retrieval:
  top_k: 25
  rrf_k_const: 60
  query_fallback_top_k: 5  # cap sui risultati restituiti nel fallback_retrieve di un cache MISS

edges:
  edge_keyword_min: 0.5
  edge_semantic_min: 0.6
  edge_keyword_topk: 5
  edge_semantic_topk: 20
  mmr_lambda: 0.7

explore:
  default_beam: 4
  default_depth: 3
  decay_gamma: 0.85
  alpha: 0.5

# Optional HTTP/REST layer + 3D viewer. Off by default. When enabled, the
# daemon spawns a TCP listener bound to `bind:port` and serves /v1/* JSON
# endpoints plus the viewer SPA at /. See docs/HTTP-API.md for the full
# endpoint reference. Keep this bound to 127.0.0.1 for production and put
# integrations/mcp-server/oauth_gateway.py in front for OAuth/OIDC.
http:
  enabled: false
  bind: "127.0.0.1"             # local-first; do not expose memgraphd directly
  port: 9977
  endpoint_match:    true       # GET  /v1/match
  endpoint_search:   true       # GET  /v1/search
  endpoint_explore:  true       # GET  /v1/explore
  endpoint_classify: true       # GET  /v1/classify
  endpoint_insert:   true       # POST /v1/insert
  endpoint_delete:   false      # DELETE /v1/nodes/{id} — sensitive, off by default
  endpoint_view:     true       # GET  /v1/view (full graph dump for the viewer)
  viewer_path: "viewer/dist"    # static bundle served at /
