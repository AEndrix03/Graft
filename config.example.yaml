daemon:
  socket_path: "/tmp/memgraph.sock"
  db_path: "./memgraph.db"

embedding:
  model_path: "./models/bge-m3.gguf"
  threads: 4
  ctx_size: 8192

verification:
  cross_encoder_enabled: false # MVP: false. Accendi in v2 con il modello reranker.
  cross_encoder_model_path: "./models/bge-reranker-v2-m3.gguf"
  nli_enabled: false

cache:
  strong_hit_min_ce: 0.6
  strong_hit_min_lex: 0.15
  weak_hit_min_vec: 0.85
  min_lex_overlap: 0.05

retrieval:
  top_k: 25
  rrf_k_const: 60
  query_fallback_top_k: 5  # cap sui risultati restituiti nel fallback_retrieve di un cache MISS

edges:
  edge_keyword_min: 0.5
  edge_semantic_min: 0.6
  edge_keyword_topk: 5
  edge_semantic_topk: 20
  mmr_lambda: 0.7

explore:
  default_beam: 4
  default_depth: 3
  decay_gamma: 0.85
  alpha: 0.5
